name: Gráfico de contribuições

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/contrib.mjs]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/contrib.mjs ${{ github.repository_owner }} dist/contrib.svg
      - name: Publica no branch output
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib.svg
          git commit -qm "Atualiza gráfico de contribuições"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
